services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delegato
      POSTGRES_PASSWORD: delegato
      POSTGRES_DB: delegato
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delegato"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  taskiq-worker:
    build: .
    command: taskiq worker app.broker:broker --workers 2
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  taskiq-scheduler:
    build: .
    command: taskiq scheduler app.scheduler:scheduler --skip-first-run
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
