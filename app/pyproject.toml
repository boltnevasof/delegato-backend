[tool.poetry]
name = "delegato-backend"
version = "1.0.0"
description = "Delegato — managed AI agent platform backend"
authors = ["Delegato Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.14"
pydantic = "^2.9"
pydantic-settings = "^2.6"
pyjwt = "^2.9"
authlib = "^1.3"
httpx = "^0.27"
redis = "^7.0"
taskiq = "^0.12"
taskiq-redis = "^1.2"
taskiq-fastapi = "^0.4"
loguru = "^0.7"
sentry-sdk = {extras = ["fastapi"], version = "^2.18"}
slowapi = "^0.1"
python-multipart = "^0.0.9"
itsdangerous = "^2.2"
dependency-injector = "^4.42"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
