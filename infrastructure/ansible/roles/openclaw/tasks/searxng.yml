---
# T008: Deploy SearXNG for web search

- name: Create SearXNG directory
  ansible.builtin.file:
    path: /opt/searxng
    state: directory
    mode: "0755"

- name: Deploy SearXNG docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/searxng/docker-compose.yml
    mode: "0644"

- name: Start SearXNG container
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/searxng
  changed_when: true

- name: Wait for SearXNG to start
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ searxng_port }}"
    timeout: 60

- name: Enable JSON API in SearXNG
  ansible.builtin.command:
    cmd: docker exec searxng sed -i 's/json: false/json: true/' /etc/searxng/settings.yml
  changed_when: true

- name: Restart SearXNG to apply JSON API setting
  ansible.builtin.command:
    cmd: docker restart searxng
  changed_when: true

- name: Wait for SearXNG to restart
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ searxng_port }}"
    timeout: 60

- name: Verify SearXNG JSON API responds
  ansible.builtin.uri:
    url: "http://localhost:{{ searxng_port }}/search?q=test&format=json"
    return_content: false
    status_code: 200
  retries: 3
  delay: 5
