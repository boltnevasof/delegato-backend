---
# T020: Deploy workspace files from Jinja2 templates (only if not exists)

- name: Check if AGENTS.md exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.openclaw/workspace/AGENTS.md"
  register: agents_md

- name: Deploy AGENTS.md
  ansible.builtin.template:
    src: agents.md.j2
    dest: "{{ ansible_env.HOME }}/.openclaw/workspace/AGENTS.md"
    mode: "0644"
  when: not agents_md.stat.exists

- name: Check if SOUL.md exists
