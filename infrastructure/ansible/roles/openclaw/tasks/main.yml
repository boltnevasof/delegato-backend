---
# OpenClaw role entry point — orchestrates all subtasks

- name: Install OpenClaw
  ansible.builtin.include_tasks: install.yml

- name: Setup SearXNG
  ansible.builtin.include_tasks: searxng.yml

- name: Setup Browser
  ansible.builtin.include_tasks: browser.yml

- name: Setup Workspace files
  ansible.builtin.include_tasks: workspace.yml

- name: Setup Memory and Embeddings
  ansible.builtin.include_tasks: memory.yml
  when: openai_api_key | default('') != ""

- name: Setup Systemd service
  ansible.builtin.include_tasks: systemd.yml

- name: Setup Security
  ansible.builtin.include_tasks: security.yml
