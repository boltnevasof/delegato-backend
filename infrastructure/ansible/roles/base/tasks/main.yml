---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - nano
      - ufw
      - fail2ban
      - unattended-upgrades
      - sqlite3
      - jq
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Configure UFW - deny all incoming by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Configure UFW - allow outgoing by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH (port 22)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTPS (port 443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# Swap file for low-memory servers (< 4GB RAM)
- name: Check if swap file exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file

- name: Create 2GB swap file
  ansible.builtin.command:
    cmd: fallocate -l 2G /swapfile
    creates: /swapfile
  when:
    - ansible_memtotal_mb < 4096
    - not swap_file.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when:
    - ansible_memtotal_mb < 4096
    - not swap_file.stat.exists

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when:
    - ansible_memtotal_mb < 4096
    - not swap_file.stat.exists
  changed_when: true

- name: Enable swap file
  ansible.builtin.command:
    cmd: swapon /swapfile
  when:
    - ansible_memtotal_mb < 4096
    - not swap_file.stat.exists
  changed_when: true

- name: Add swap to fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present
  when: ansible_memtotal_mb < 4096
